services:
  - type: web
    name: boardcollab-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start --workspace=@boardcollab/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
